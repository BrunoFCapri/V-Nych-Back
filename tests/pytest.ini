[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    auth: Authentication tests
    notes: Notes tests
    calendar: Calendar events tests
    tasks: Tasks tests
    lists: Task lists tests
    attachments: Attachments tests
    admin: Admin endpoint tests
    health: Health check tests
    e2e: End-to-end tests (tp_testing)
